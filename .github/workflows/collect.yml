name: Collect price exposure

on:
  workflow_dispatch:
    inputs:
      force_briefing:
        description: "Generate an 08:00 basic briefing for this manual run"
        required: false
        default: false
        type: boolean
  schedule:
    # 정각 혼잡을 피한 주 수집: 00/04/08/12/16/20시 07분(KST)
    - cron: "7 3 * * *"
    - cron: "7 7 * * *"
    - cron: "7 11 * * *"
    - cron: "7 15 * * *"
    - cron: "7 19 * * *"
    - cron: "7 23 * * *"
    # 같은 회차의 원본이 Drive에 없을 때만 수행하는 17분(KST) 보정 수집
    - cron: "17 3 * * *"
    - cron: "17 7 * * *"
    - cron: "17 11 * * *"
    - cron: "17 15 * * *"
    - cron: "17 19 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: read

concurrency:
  group: price-monitoring-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
      DRIVE_SHARED_SECRET: ${{ secrets.DRIVE_SHARED_SECRET }}
      # GitHub가 실제 시작을 지연해도, 원래 예정된 08시 회차는 08시 브리핑으로 처리한다.
      SCHEDULED_SLOT_HOUR_KST: ${{ (github.event.schedule == '7 23 * * *' || github.event.schedule == '17 23 * * *') && '8' || (github.event.schedule == '7 19 * * *' || github.event.schedule == '17 19 * * *') && '4' || (github.event.schedule == '7 15 * * *' || github.event.schedule == '17 15 * * *') && '0' || (github.event.schedule == '7 11 * * *' || github.event.schedule == '17 11 * * *') && '20' || (github.event.schedule == '7 7 * * *' || github.event.schedule == '17 7 * * *') && '16' || (github.event.schedule == '7 3 * * *' || github.event.schedule == '17 3 * * *') && '12' || '' }}
      IS_FALLBACK: ${{ startsWith(github.event.schedule, '17 ') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, generate AI input, and save to Drive
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.force_briefing }}" == "true" ]]; then args+=(--force-briefing); fi
          if [[ -n "$SCHEDULED_SLOT_HOUR_KST" ]]; then args+=(--scheduled-slot-hour "$SCHEDULED_SLOT_HOUR_KST"); fi
          if [[ "$IS_FALLBACK" == "true" ]]; then args+=(--skip-if-slot-exists); fi
          python src/monitor.py "${args[@]}"
      - name: Preserve run artifact for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-monitoring-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

